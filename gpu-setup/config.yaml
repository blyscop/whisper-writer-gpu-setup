misc:
  hide_status_window: false
  noise_on_completion: true
  print_to_terminal: true
model_options:
  api:
    api_key: null
    base_url: http://127.0.0.1:8089/v1
    model: whisper-1
  common:
    initial_prompt: null
    language: fr
    temperature: 0.0
  local:
    compute_type: int8
    condition_on_previous_text: true
    device: auto
    model: medium
    model_path: null
    vad_filter: false
  use_api: true
post_processing:
  add_trailing_space: true
  input_method: auto
  remove_capitalization: false
  remove_trailing_period: false
  writing_key_press_delay: 0.005
recording_options:
  activation_key: ctrl+shift+alt
  input_backend: evdev
  min_duration: 100
  recording_mode: hold_to_record
  sample_rate: 16000
  silence_duration: 900
  sound_device: null
